name: build-and-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "deploy.sh"
      - ".github/workflows/deploy.yml"

env:
  # 镜像必须带 <org>/<name>，裸名会被解析到 official/ 命名空间
  IMAGE_REF: longke233/uptime-kuma:latest
  INSTANCE_NAME: kuma
  METRO: sin
  MEM_MB: "1024"
  DEST_PORT: "3001"
  VOLUME_NAME: kuma-data
  VOLUME_MOUNT: /app/data

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Unikraft CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://unikraft.com/cli/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 登录 Unikraft
        env:
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN }}
        run: |
          echo "$UNIKRAFT_TOKEN" | unikraft login --token -
          unikraft instances list || true

      - name: 构建并推送镜像
        run: |
          unikraft build ./Dockerfile --arch x86_64 --output "$IMAGE_REF"

      - name: 部署实例
        env:
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN }}
        run: bash deploy.sh
